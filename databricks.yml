# Declarative Automation Bundle definition for the Bookstore DLT Pipeline
# Deploy with: databricks bundle deploy --target dev

bundle:
  name: bookstore-dlt-training

variables:
  catalog:
    description: "Unity Catalog catalog for pipeline output tables and job parameters"
    default: "workspace"
  schema:
    description: "Schema within the catalog for pipeline output tables and job parameters"
    default: "aws_training_data"
  datasets_path:
    description: "UC Volume path containing the source bookstore dataset"
    default: "/Volumes/workspace/aws_training_data/bookstore_dataset"
  run_as:
    description: >-
      Application (client) ID of the dedicated, minimally-privileged service
      principal that deployed jobs/pipelines execute as for this target.
      Empty default so `bundle validate` works before setup runs; the dev and
      prod targets require a real value at deploy time. Populated by
      `scripts/setup.sh <dev|prod>`, which also creates that service
      principal and grants it just enough Unity Catalog access — see that
      script and scripts/setup.sql. Do not set by hand.
    default: "dummy"

resources:
  pipelines:
    bookstore_dlt:
      name: "Bookstore DLT Pipeline"
      catalog: "${var.catalog}"
      schema: "${var.schema}"
      serverless: true
      photon: true
      continuous: false
      channel: "CURRENT"
      configuration:
        datasets_path: "${var.datasets_path}"
      libraries:
        - notebook:
            path: "./4- Production Pipelines/4.1 - Delta Live Tables.sql"

    bookstore_pyspark_dlt:
      name: "Bookstore DLT Pipeline (PySpark)"
      catalog: "${var.catalog}"
      schema: "${var.schema}"
      serverless: true
      photon: true
      continuous: false
      channel: "CURRENT"
      configuration:
        datasets_path: "${var.datasets_path}"
      libraries:
        - notebook:
            path: "./4- Production Pipelines/4.1b - Delta Live Tables PySpark.py"

  jobs:
    bookstore_demo_job:
      name: "Bookstore Demo Job"
      performance_target: "PERFORMANCE_OPTIMIZED"
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: "Run_Load_Data_Notebook"
          notebook_task:
            notebook_path: "./4- Production Pipelines/4.3 - Land New Data Task.py"
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              dataset_bookstore: "${var.datasets_path}"
          environment_key: "Default"

        - task_key: "Run_DLT_Pipeline"
          depends_on:
            - task_key: "Run_Load_Data_Notebook"
          pipeline_task:
            pipeline_id: "${resources.pipelines.bookstore_dlt.id}"

        - task_key: "Run_Execute_Results_Notebook"
          depends_on:
            - task_key: "Run_DLT_Pipeline"
          notebook_task:
            notebook_path: "./4- Production Pipelines/4.2 - Pipeline Results.py"
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              dataset_bookstore: "${var.datasets_path}"
          environment_key: "Default"

      environments:
        - environment_key: "Default"
          spec:
            environment_version: "5"

targets:
  # Personal sandbox — deploy directly from the CLI. Default target so bare
  # `databricks bundle deploy` (no --target) never touches shared dev/prod.
  # To override a variable for this target only, add e.g.:
  #   variables:
  #     catalog: my_personal_catalog
  personal:
    mode: development
    default: true
    workspace:
      host: https://dbc-8247e575-4536.cloud.databricks.com/

  # Shared dev workspace — deployed only via the GitHub Actions workflow.
  # run_as (per-target override, keeps `personal` running as your own user)
  # decouples "who deploys" from "who the deployed jobs/pipelines run as":
  # the deploying identity (github-actions-deploy SP) only needs permission
  # to push bundle resources plus the Service Principal User role on this
  # run-as SP — not direct data access. See scripts/setup.sh.
  dev:
    mode: development
    workspace:
      host: https://dbc-9d50ffda-1704.cloud.databricks.com/
    run_as:
      service_principal_name: "${var.run_as}"
    variables:
      run_as: "6755cda2-24cd-494b-ac8b-c6be85009f6f"

  # Production (aws-hosted) — deployed only via the GitHub Actions workflow,
  # gated behind the 'production' environment's required reviewer.
  # Uses its own catalog name (prod-workspace) since a Unity Catalog metastore
  # cannot contain two catalogs both named "workspace". The hyphen requires
  # every `USE CATALOG ...` statement to backtick-quote the catalog name
  # (see Includes/Copy-Datasets.py and 4.2 - Pipeline Results.py) since
  # unquoted it parses as subtraction and fails with UNRESOLVED_COLUMN.
  prod:
    mode: production
    workspace:
      host: https://dbc-019e110a-3092.cloud.databricks.com/
    run_as:
      service_principal_name: "${var.run_as}"
    variables:
      catalog: "prod-workspace"
      schema: "default"
      datasets_path: "/Volumes/prod-workspace/default/bookstore_dataset"
      run_as: "a3eafda7-0112-41a8-a0ae-03f760eeaa3b"
